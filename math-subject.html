<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F-Mine | Математика</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
:root{--bg:#f5f8ff;--surface:#fff;--surface2:#eef2fc;--surface3:#dfe6f7;--border:rgba(29,64,175,.08);--border2:rgba(29,64,175,.16);--blue:#1d4ed8;--blue2:#1e40af;--gold:#f59e0b;--text:#141f3d;--muted:#68739a;--danger:#dc2626;--green:#16a34a;--radius:16px;--shadow-sm:0 1px 3px rgba(29,64,175,.05);--shadow:0 4px 14px rgba(29,64,175,.07);--shadow-lg:0 10px 40px rgba(29,64,175,.1);--shadow-xl:0 20px 60px rgba(29,64,175,.14)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(29,78,216,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(245,158,11,.05) 0%,transparent 50%);pointer-events:none;z-index:0}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;cursor:pointer}
.logo-f{background:linear-gradient(135deg,var(--blue),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-rest{color:var(--text)}
.header-right{display:flex;gap:8px;align-items:center}
.header-nav{display:flex;gap:8px;align-items:center}
.nav-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;transition:.15s}
.nav-btn:hover{border-color:var(--blue);color:var(--blue)}
.nav-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.nav-btn.graph{background:var(--gold);color:#fff;border-color:var(--gold);box-shadow:0 2px 10px rgba(245,158,11,.3)}
.view{display:none;position:relative;z-index:1;min-height:calc(100vh - 54px)}
.view.active{display:block}
#gradeView{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px}
.grade-title{font-size:36px;font-weight:800;margin-bottom:8px;text-align:center}
.grade-sub{color:var(--muted);font-size:15px;margin-bottom:40px;text-align:center}
.grade-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;max-width:720px;width:100%}
.grade-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 16px;text-align:center;cursor:pointer;transition:.25s;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.grade-card:hover{border-color:var(--blue);transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.grade-card .grade-num{font-size:42px;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grade-card .grade-label{font-size:13px;color:var(--muted);margin-top:4px}
.grade-card .grade-badge{position:absolute;top:10px;right:10px;background:var(--blue);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px}
#topicView{padding:30px 24px;max-width:900px;margin:0 auto}
.topic-head{margin-bottom:28px}
.topic-head h1{font-size:28px;font-weight:800;margin-bottom:4px}
.topic-head p{color:var(--muted);font-size:14px}
.topic-progress-bar{height:6px;background:var(--surface3);border-radius:6px;margin-top:14px;overflow:hidden}
.topic-progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:6px;transition:width .4s}
.topic-list{display:flex;flex-direction:column;gap:10px}
.topic-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:.2s;box-shadow:var(--shadow-sm)}
.topic-card:hover{border-color:var(--blue);background:rgba(29,78,216,.03);transform:translateX(3px)}
.topic-card.done{border-color:rgba(22,163,74,.3)}
.topic-num{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--muted)}
.topic-card.done .topic-num{background:rgba(22,163,74,.1);color:var(--green)}
.topic-card:hover .topic-num{background:rgba(29,78,216,.1);color:var(--blue)}
.topic-info{flex:1}.topic-name{font-size:14px;font-weight:600}.topic-arrow{color:var(--muted)}
#lessonView.active{display:flex;height:calc(100vh - 54px)}
.lesson-back{position:fixed;top:64px;left:16px;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;display:none;box-shadow:var(--shadow)}
.lesson-theory{flex:1;overflow-y:auto;padding:28px 32px 120px;border-right:1px solid var(--border)}
.lesson-practice{width:380px;flex-shrink:0;overflow-y:auto;padding:24px 20px 120px;background:var(--surface)}
.theory-section{margin-bottom:28px}
.theory-section h2{font-size:18px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.theory-section h2 .section-icon{font-size:20px}
.theory-section p,.theory-section li{font-size:14px;line-height:1.7;color:#3a466e}
.theory-section ul,.theory-section ol{padding-left:20px;margin:8px 0}
.theory-section li{margin-bottom:4px}
.theory-section .highlight-box{background:rgba(29,78,216,.05);border:1px solid rgba(29,78,216,.12);border-radius:12px;padding:14px 18px;margin:12px 0}
.theory-section .highlight-box.gold{background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.15)}
.theory-section .highlight-box.green{background:rgba(22,163,74,.05);border-color:rgba(22,163,74,.12)}
.formula-block{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin:10px 0;text-align:center;font-size:18px;overflow-x:auto}
.example-block{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:12px 0}
.example-block h3{color:var(--blue);font-size:14px;margin-bottom:12px}
.example-block .step{display:flex;gap:10px;margin-bottom:10px;font-size:13px;line-height:1.7}
.example-block .step-num{width:22px;height:22px;border-radius:50%;flex-shrink:0;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.example-block .step-rule{color:var(--gold);font-size:11px;font-weight:600;display:block;margin-top:2px}
.context-box{background:linear-gradient(135deg,rgba(29,78,216,.06),rgba(245,158,11,.04));border:1px solid rgba(29,78,216,.12);border-radius:var(--radius);padding:18px 20px;margin-bottom:24px}
.context-box h3{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.context-box p{font-size:14px;line-height:1.7;color:#3a466e}
.graph-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0d2a55,#123a75);border-radius:var(--radius);padding:14px 18px;margin-bottom:24px;color:#dff3ff}
.graph-banner button{margin-left:auto;background:var(--gold);border:none;color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.lesson-photo{display:none;margin:0 0 22px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:var(--surface);position:relative}
.lesson-photo.show{display:block}
.lesson-photo img{width:100%;height:auto;max-height:400px;object-fit:contain;background:var(--surface3);display:block}
.photo-cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;background:linear-gradient(transparent,rgba(20,31,61,.8));color:#fff;font-size:12px;font-weight:600}
.photo-skel{height:260px;background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.practice-head{margin-bottom:16px}.practice-head h2{font-size:18px;font-weight:700}.practice-head p{font-size:12px;color:var(--muted)}
.practice-stats{display:flex;gap:8px;margin-bottom:16px}
.stat-chip{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.stat-chip .stat-val{font-size:20px;font-weight:800}.stat-chip .stat-label{font-size:10px;color:var(--muted);margin-top:2px}
.stat-chip.correct .stat-val{color:var(--green)}.stat-chip.wrong .stat-val{color:var(--danger)}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.task-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.task-formula{font-size:17px;line-height:1.8;text-align:center;padding:14px 16px;background:var(--surface2);border-radius:12px;margin-bottom:14px;min-height:50px;display:flex;align-items:center;justify-content:center}
.task-input-row{display:flex;gap:8px}
.task-input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:15px;outline:none;text-align:center}
.task-input:focus{border-color:var(--blue)}
.task-input.correct{border-color:var(--green);background:rgba(22,163,74,.05)}
.task-input.wrong{border-color:var(--danger);background:rgba(220,38,38,.05)}
.check-btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.check-btn:hover{background:var(--blue2)}.check-btn:disabled{opacity:.4;cursor:not-allowed}
.next-btn{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;margin-top:8px;display:none}
.next-btn:hover{border-color:var(--blue);color:var(--blue)}
.task-feedback{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6;display:none}
.task-feedback.correct{display:block;background:rgba(22,163,74,.06);border:1px solid rgba(22,163,74,.15);color:#16a34a}
.task-feedback.wrong{display:block;background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.15);color:var(--danger)}
.task-solution{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.6}
.task-type-tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.task-type-tab{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:inherit}
.task-type-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.hint-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--gold);cursor:pointer;font-family:inherit;margin-top:8px;display:none}
.hint-text{display:none;margin-top:8px;padding:10px;background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);border-radius:10px;font-size:12px;color:#92400e;line-height:1.6}
.ai-fab{position:fixed;bottom:24px;right:24px;z-index:200;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--gold));border:none;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(29,78,216,.35);display:none;align-items:center;justify-content:center}
#lessonView.active ~ .ai-fab{display:flex}
.ai-panel{display:none;position:fixed;bottom:88px;right:24px;z-index:199;width:min(380px,calc(100vw - 40px));height:460px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);flex-direction:column;box-shadow:var(--shadow-xl)}
.ai-panel.open{display:flex}
.ai-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.ai-head-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.ai-head span{font-size:13px;font-weight:600;flex:1}
.ai-close{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer}
.ai-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.ai-msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6}
.ai-msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.ai-msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.ai-typing{display:flex;gap:4px;padding:10px 14px}
.ai-typing span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:aiDot 1.2s infinite}
.ai-typing span:nth-child(2){animation-delay:.2s}.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes aiDot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.ai-input-row{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px}
.ai-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 13px;font-size:13px;outline:none;font-family:inherit}
.ai-send{background:var(--blue);color:#fff;border:none;border-radius:10px;width:38px;height:38px;font-size:15px;cursor:pointer}
.ai-quick-btns{display:flex;gap:4px;padding:0 12px 8px;flex-wrap:wrap}
.ai-quick-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:10px;color:var(--muted);cursor:pointer;font-family:inherit}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border2);border-radius:24px;padding:8px 18px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:300;white-space:nowrap}
#toast.show{opacity:1;bottom:100px}
/* ГРАФЕР */
.graph-modal{position:fixed;inset:0;z-index:400;background:rgba(8,20,40,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.graph-modal.hidden{display:none}
.graph-box{width:min(1060px,97vw);height:min(660px,92vh);background:var(--surface);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-xl)}
.graph-head{padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--border)}
.graph-title{font-weight:800;margin-right:8px}
.gpre,.dact{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
.gpre.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.graph-params{display:flex;gap:6px;align-items:center;margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.graph-params input{width:56px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 6px;font-family:'JetBrains Mono',monospace;font-size:13px;text-align:center;outline:none}
.graph-body{flex:1;position:relative}
#graphCanvas{position:absolute;inset:0;width:100%;height:100%}
.graph-info{position:absolute;left:12px;bottom:12px;right:12px;background:rgba(8,25,60,.88);color:#dff3ff;border:1px solid rgba(120,200,255,.3);border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.5;pointer-events:none}
@media(max-width:800px){#lessonView.active{flex-direction:column}.lesson-theory{border-right:none;border-bottom:1px solid var(--border);padding-bottom:20px}.lesson-practice{width:100%;padding-bottom:20px}.ai-panel{width:calc(100vw - 32px);right:16px;bottom:80px;height:380px}.graph-params{margin-left:0}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#c3cde8;border-radius:6px}
.katex{font-size:inherit}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="showGrades()"><span class="logo-f">F</span><span class="logo-rest">-Mine Математика</span></div>
  <div class="header-right">
    <div class="header-nav" id="headerNav"></div>
    <button class="nav-btn graph" onclick="openGraph()">📈 Графики</button>
  </div>
</header>

<div id="gradeView" class="view active">
  <div class="grade-title">Математика · Алгебра</div>
  <div class="grade-sub">Выбери класс — боты сгенерируют бесконечные уравнения 🤖</div>
  <div class="grade-grid" id="gradeGrid"></div>
</div>

<div id="topicView" class="view"></div>
<div id="lessonView" class="view"></div>
<button class="lesson-back" id="lessonBack" onclick="goBack()">← Назад</button>

<button class="ai-fab" id="aiFab" onclick="toggleAi()">🤖</button>
<div class="ai-panel" id="aiPanel">
  <div class="ai-head">
    <div class="ai-head-dot"></div>
    <span>F-Mine AI Помощник</span>
    <button class="ai-close" onclick="toggleAi()">✕</button>
  </div>
  <div class="ai-messages" id="aiMessages">
    <div class="ai-msg bot">Привет! Я помогу с алгеброй и уравнениями. Спроси что угодно 🤓</div>
  </div>
  <div class="ai-quick-btns">
    <button class="ai-quick-btn" onclick="askAi('Объясни последний пример')">💡 Объясни пример</button>
    <button class="ai-quick-btn" onclick="askAi('Дай подсказку к текущей задаче')">🎯 Подсказка</button>
    <button class="ai-quick-btn" onclick="askAi('Покажи ещё один пример')">📝 Ещё пример</button>
  </div>
  <div class="ai-input-row">
    <input class="ai-input" id="aiInput" placeholder="Задай вопрос..." onkeydown="if(event.key==='Enter')sendAi()" />
    <button class="ai-send" onclick="sendAi()">→</button>
  </div>
</div>

<!-- ГРАФЕР -->
<div class="graph-modal hidden" id="graphModal">
  <div class="graph-box">
    <div class="graph-head">
      <span class="graph-title">📈 Графики функций</span>
      <button class="gpre on" data-fam="quad">y=ax²+bx+c</button>
      <button class="gpre" data-fam="hyp">y=k/x</button>
      <button class="gpre" data-fam="lin">y=kx+b</button>
      <button class="gpre" data-fam="sq">y=x²</button>
      <button class="gpre" data-fam="sqrt">y=√x</button>
      <button class="gpre" data-fam="abs">y=|x|</button>
      <div class="graph-params">
        a<input id="pa" type="number" value="1"> b<input id="pb" type="number" value="0"> c<input id="pc" type="number" value="-4"> k<input id="pk" type="number" value="4">
      </div>
      <button class="dact" onclick="closeGraph()">✕</button>
    </div>
    <div class="graph-body"><canvas id="graphCanvas"></canvas><div class="graph-info" id="graphInfo"></div></div>
  </div>
</div>

<div id="toast"></div>

<script src="math-lessons.js"></script>
<script>
const GRADES=[
  {id:7,label:'7 класс',badge:'Базовый'},
  {id:8,label:'8 класс',badge:'Дроби и уравнения'},
  {id:9,label:'9 класс',badge:'Прогрессии'},
  {id:10,label:'10 класс',badge:'Тригонометрия'},
  {id:11,label:'11 класс',badge:'Экзамен'}
];
const TOPICS={
  7:[
    {id:'7.1',name:'Числовые выражения и порядок действий',icon:'🔢'},
    {id:'7.2',name:'Степень с натуральным показателем',icon:'ⁿ'},
    {id:'7.3',name:'Одночлены и многочлены',icon:'➕'},
    {id:'7.4',name:'Формулы сокращённого умножения',icon:'✂️'},
    {id:'7.5',name:'Линейные уравнения',icon:'⚖️'},
    {id:'7.6',name:'Линейная функция y=kx+b',icon:'📈'}
  ],
  8:[
    {id:'8.1',name:'Рациональные выражения и ОДЗ',icon:'🚫'},
    {id:'8.2',name:'Арифметика рациональных дробей',icon:'➗'},
    {id:'8.3',name:'Действительные числа и множества',icon:'ℝ'},
    {id:'8.4',name:'Квадратные корни и их свойства',icon:'√'},

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1}
function fr(p,q){if(q<0){p=-p;q=-q}const d=gcd(p,q);p/=d;q/=d;return q===1?String(p):p+'/'+q}
function fracForms(p,q){if(q<0){p=-p;q=-q}const d=gcd(p,q);p/=d;q/=d;const f=[q===1?String(p):p+'/'+q];const dec=Math.round(p/q*100)/100;f.push(String(dec));f.push(String(dec).replace('.',','));return[...new Set(f)]}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function renderKatex(el){if(typeof renderMathInElement==='function')renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
function normAns(v){return String(v).toLowerCase().replace(/ё/g,'е').replace(/['’]/g,'').trim().replace(/\s+/g,' ').replace(/[.!?,;:°]+$/,'')}

async function loadLessonPhoto(){
  const box=document.getElementById('lessonPhoto');if(!box)return;
  const lesson=LESSONS[currentTopic];
  function showImg(src,fb,cap){box.classList.add('show');box.innerHTML=`<img src="${src}" alt="${cap}" loading="lazy"><div class="photo-cap">📷 ${cap}</div>`;const img=box.querySelector('img');let s=0;img.addEventListener('error',()=>{s++;if(s===1&&fb)img.src=fb;else box.remove()})}
  if(lesson&&lesson.img){showImg(lesson.img,null,lesson.title);return}
  const title=WIKI[currentTopic];if(!title){box.remove();return}
  try{const r=await fetch('https://ru.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));if(!r.ok)throw 0;const d=await r.json();const th=d.thumbnail?d.thumbnail.source:null;if(!th)throw 0;const o=d.originalimage||null;const big=th.replace(/\/\d+px-/,'/1200px-');showImg((o&&o.source&&o.width&&o.width<=1000)?o.source:big,th,title)}catch(e){box.remove()}
}

/* ================= ГРАФЕР ================= */
let graphOpen=false,gf={fam:'quad',a:1,b:0,c:-4,k:4};
const gv=document.getElementById('graphCanvas'),gx=gv.getContext('2d');
function openGraph(){graphOpen=true;document.getElementById('graphModal').classList.remove('hidden');requestAnimationFrame(sizeG)}
function closeGraph(){graphOpen=false;document.getElementById('graphModal').classList.add('hidden')}
function sizeG(){const r=gv.parentElement.getBoundingClientRect();gv.width=Math.floor(r.width);gv.height=Math.floor(r.height);drawGraph()}
window.addEventListener('resize',()=>{if(graphOpen)sizeG()});
document.querySelectorAll('.gpre').forEach(b=>b.onclick=()=>{gf.fam=b.dataset.fam;document.querySelectorAll('.gpre').forEach(x=>x.classList.toggle('on',x===b));drawGraph()});
['pa','pb','pc','pk'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{gf[{pa:'a',pb:'b',pc:'c',pk:'k'}[id]]=parseFloat(e.target.value)||0;drawGraph()}));
function fval(x){switch(gf.fam){case'hyp':return gf.k/x;case'sq':return x*x;case'quad':return gf.a*x*x+gf.b*x+gf.c;case'sqrt':return x>=0?Math.sqrt(x):NaN;case'abs':return Math.abs(x);case'lin':return gf.k*x+gf.b}}
function drawGraph(){
  const W=gv.width,H=gv.height,S=40,cx=W/2,cy=H/2;
  gx.fillStyle='#0d2a55';gx.fillRect(0,0,W,H);
  gx.strokeStyle='rgba(140,190,255,.14)';gx.lineWidth=1;
  for(let x=cx%S;x<W;x+=S){gx.beginPath();gx.moveTo(x+.5,0);gx.lineTo(x+.5,H);gx.stroke()}
  for(let y=cy%S;y<H;y+=S){gx.beginPath();gx.moveTo(0,y+.5);gx.lineTo(W,y+.5);gx.stroke()}
  gx.strokeStyle='#7dd3fc';gx.lineWidth=1.5;
  gx.beginPath();gx.moveTo(0,cy);gx.lineTo(W,cy);gx.stroke();
  gx.beginPath();gx.moveTo(cx,0);gx.lineTo(cx,H);gx.stroke();
  gx.fillStyle='#9cc8ff';gx.font='10px JetBrains Mono';
  for(let i=-Math.floor(cx/S);i<=cx/S;i++){if(i)gx.fillText(i,cx+i*S-3,cy+12)}
  for(let i=-Math.floor(cy/S);i<=cy/S;i++){if(i)gx.fillText(i,cx+4,cy-i*S+3)}
  gx.strokeStyle='#fbbf24';gx.lineWidth=2.5;gx.beginPath();let pen=false;
  for(let px=0;px<W;px++){const x=(px-cx)/S;const y=fval(x);
    if(!isFinite(y)||Math.abs(y)>1e3){pen=false;continue}
    const py=cy-y*S;if(py<-200||py>H+200){pen=false;continue}
    if(!pen){gx.moveTo(px,py);pen=true}else gx.lineTo(px,py)}
  gx.stroke();
  let info='';
  if(gf.fam==='quad'){const a=gf.a||1;const x0=-gf.b/(2*a);const y0=fval(x0);const D=gf.b*gf.b-4*a*gf.c;
    gx.fillStyle='#f87171';gx.beginPath();gx.arc(cx+x0*S,cy-y0*S,5,0,7);gx.fill();
    info=`⛰️ Парабола: вершина (<b>${Math.round(x0*100)/100}; ${Math.round(y0*100)/100}</b>), ветви ${a>0?'вверх ↑':'вниз ↓'}, D=${D}`}
  if(gf.fam==='hyp')info=`〽️ Гипербола: k=${gf.k} → ветви в ${gf.k>0?'I и III':'II и IV'} четвертях. Оси — асимптоты.`;
  if(gf.fam==='lin')info=`📏 Прямая: угловой коэффициент k=${gf.k}, сдвиг b=${gf.b}.`;
  if(gf.fam==='sq')info='⛰️ Парабола y=x²: вершина в (0;0).';
  if(gf.fam==='sqrt')info='√ Ветвь параболы: определена при x≥0.';
  if(gf.fam==='abs')info='⌐ «Уголок» y=|x|: вершина в (0;0).';
  document.getElementById('graphInfo').innerHTML=info;
}

/* ================= ОСНОВНАЯ ЛОГИКА ================= */
let currentGrade=null,currentTopic=null,currentTaskType=0,stats={correct:0,wrong:0,streak:0},currentTask=null,aiOpen=false,aiHistory=[];
function showView(id){document.querySelectorAll('.view').forEach(v=>{v.classList.remove('active');v.style.display='none'});const t=document.getElementById(id);t.classList.add('active');t.style.display=''}
function showGrades(){currentGrade=null;currentTopic=null;document.getElementById('lessonBack').style.display='none';document.getElementById('aiFab').style.display='none';document.getElementById('aiPanel').classList.remove('open');document.getElementById('headerNav').innerHTML='';showView('gradeView')}
function showTopics(gid){
  currentGrade=gid;const topics=TOPICS[gid]||[];
  const completed=JSON.parse(localStorage.getItem('fmine_math_topics')||'[]');
  const done=topics.filter(t=>completed.includes(t.id)).length;
  const pct=topics.length?Math.round(done/topics.length*100):0;
  document.getElementById('topicView').innerHTML=`
    <div class="topic-head"><h1>${gid} класс — Математика</h1><p>${topics.length} тем · Изучено: ${done}/${topics.length}</p>
    <div class="topic-progress-bar"><div class="topic-progress-fill" style="width:${pct}%"></div></div></div>
    <div class="topic-list">${topics.map((t,i)=>`<div class="topic-card ${completed.includes(t.id)?'done':''}" onclick="openLesson('${t.id}')"><div class="topic-num">${completed.includes(t.id)?'✓':i+1}</div><div class="topic-info"><div class="topic-name">${t.icon} ${t.name}</div></div><div class="topic-arrow">›</div></div>`).join('')}</div>`;
  showView('topicView');
  document.getElementById('headerNav').innerHTML=`<button class="nav-btn" onclick="showGrades()">← Классы</button>`;
}
function openLesson(tid){
  currentTopic=tid;const lesson=LESSONS[tid];
  if(!lesson){showToast('⚠️ Тема в разработке');return}
  stats={correct:0,wrong:0,streak:0};renderLesson(lesson);showView('lessonView');
  document.getElementById('lessonBack').style.display='';
  document.getElementById('aiFab').style.display='flex';
  document.getElementById('headerNav').innerHTML=`<button class="nav-btn" onclick="showTopics(${currentGrade})">← Темы</button><button class="nav-btn active">${TOPICS[currentGrade]?.find(t=>t.id===tid)?.icon||'∑'} ${lesson.title.slice(0,28)}...</button>`;
}
function goBack(){if(currentTopic){showTopics(currentGrade)}else{showGrades()}}
function renderLesson(lesson){
  const el=document.getElementById('lessonView');
  let th=`<div class="lesson-photo" id="lessonPhoto"><div class="photo-skel"></div></div>
  <div class="graph-banner">📈 Построй график этой функции сам! Открой Графер.<button onclick="openGraph()">📈 Открыть</button></div>
  <div class="context-box"><h3>🌍 Контекст</h3><p>${lesson.context}</p></div>`;
  lesson.theory.forEach(s=>{th+=`<div class="theory-section"><h2><span class="section-icon">${s.icon}</span> ${s.title}</h2>${s.html}</div>`});
  th+=`<div class="theory-section"><h2><span class="section-icon">📝</span> Разбор примеров</h2>`;
  lesson.examples.forEach(ex=>{th+=`<div class="example-block"><h3>${ex.title}</h3>`;ex.steps.forEach((st,j)=>{th+=`<div class="step"><div class="step-num">${j+1}</div><div>${st.text}<span class="step-rule">${st.rule}</span></div></div>`});th+=`</div>`});
  th+=`</div>`;
  let pr=`<div class="practice-head"><h2>🎯 Практика</h2><p>Бот генерирует бесконечные задачи</p></div>
    <div class="practice-stats"><div class="stat-chip correct"><div class="stat-val" id="statCorrect">0</div><div class="stat-label">Верно</div></div><div class="stat-chip wrong"><div class="stat-val" id="statWrong">0</div><div class="stat-label">Ошибки</div></div><div class="stat-chip"><div class="stat-val" id="statStreak">0</div><div class="stat-label">Серия</div></div></div>
    <div class="task-type-tabs">${lesson.taskTypes.map((tt,i)=>`<button class="task-type-tab ${i===0?'active':''}" onclick="switchTaskType(${i})">${tt.icon} ${tt.name}</button>`).join('')}</div>
    <div id="taskArea"></div>`;
  el.innerHTML=`<div class="lesson-theory">${th}</div><div class="lesson-practice">${pr}</div>`;
  setTimeout(()=>{renderKatex(el);generateTask();loadLessonPhoto()},100);
}
function switchTaskType(i){currentTaskType=i;document.querySelectorAll('.task-type-tab').forEach((t,j)=>t.classList.toggle('active',j===i));generateTask()}
function generateTask(){
  const lesson=LESSONS[currentTopic];if(!lesson)return;
  const tt=lesson.taskTypes[currentTaskType];const params=tt.generate();
const vals=Object.values(params);
const singleObj=vals.length===1&&typeof vals[0]==='object'&&vals[0]!==null;
let task;
if(!tt.template){task=params}
else if(tt.template.length===1&&!singleObj){task=tt.template(params)}
else{task=tt.template(...vals)}
currentTask={...task,typeIdx:currentTaskType};
  const area=document.getElementById('taskArea');
  area.innerHTML=`<div class="task-card"><div class="task-label">Задача</div><div class="task-formula">${currentTask.text}</div><div class="task-input-row"><input class="task-input" id="taskInput" type="text" placeholder="Ответ..." onkeydown="if(event.key==='Enter')checkAnswer()" autofocus /><button class="check-btn" id="checkBtn" onclick="checkAnswer()">Проверить</button></div><button class="hint-btn" id="hintBtn" onclick="showHint()">💡 Подсказка</button><div class="hint-text" id="hintText"></div><div class="task-feedback" id="taskFeedback"></div><button class="next-btn" id="nextBtn" onclick="generateTask()">Следующая →</button></div>`;
  setTimeout(()=>{renderKatex(area);document.getElementById('taskInput')?.focus()},50);
}
function checkAnswer(){
  const input=document.getElementById('taskInput');const val=input.value.trim();if(!val)return;
  const ans=currentTask.answer;let ok=false;
  const arr=Array.isArray(ans)?ans:[ans];
  ok=arr.some(a=>normAns(a)===normAns(val)||(normAns(a).length>2&&normAns(val).includes(normAns(a))));
  input.classList.remove('correct','wrong');input.classList.add(ok?'correct':'wrong');input.disabled=true;document.getElementById('checkBtn').disabled=true;
  const fb=document.getElementById('taskFeedback');
  if(ok){stats.correct++;stats.streak++;fb.className='task-feedback correct';fb.innerHTML=`✅ Верно! ${stats.streak>2?`🔥 Серия: ${stats.streak}`:''}`}
  else{stats.wrong++;stats.streak=0;fb.className='task-feedback wrong';fb.innerHTML=`❌ Неверно. Правильно: <b>${arr[0]}</b><div class="task-solution">${currentTask.solution}</div>`}
  document.getElementById('statCorrect').textContent=stats.correct;document.getElementById('statWrong').textContent=stats.wrong;document.getElementById('statStreak').textContent=stats.streak;
  document.getElementById('nextBtn').style.display='';document.getElementById('hintBtn').style.display='none';
}
function showHint(){const ht=document.getElementById('hintText');ht.style.display='block';ht.textContent='💡 '+currentTask.hint}
function toggleAi(){aiOpen=!aiOpen;document.getElementById('aiPanel').classList.toggle('open',aiOpen);if(aiOpen)document.getElementById('aiInput').focus()}
async function askAi(text){
  addAiMsg(text,'user');showAiTyping();
  try{const lesson=LESSONS[currentTopic];const ctx=lesson?`Тема: ${lesson.title}. Задача: ${currentTask?.text||'нет'}.`:'Математика';
  const r=await fetch('https://my-education-site-f-mine-production.up.railway.app/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:`Ты — репетитор по математике. Решай пошагово, с формулами. ${ctx}`},...aiHistory.slice(-6),{role:'user',content:text}]})});
  const d=await r.json();removeAiTyping();addAiMsg(d.reply||d.error||'Не могу ответить','bot');aiHistory.push({role:'user',content:text});aiHistory.push({role:'assistant',content:d.reply||''})}
  catch(e){removeAiTyping();addAiMsg('❌ Ошибка соединения с AI','bot')}
}
function sendAi(){const i=document.getElementById('aiInput');const v=i.value.trim();if(!v)return;i.value='';askAi(v)}
function addAiMsg(t,r){const c=document.getElementById('aiMessages');const d=document.createElement('div');d.className=`ai-msg ${r}`;d.innerHTML=t;c.appendChild(d);c.scrollTop=c.scrollHeight;setTimeout(()=>renderKatex(d),50)}
function showAiTyping(){const c=document.getElementById('aiMessages');const d=document.createElement('div');d.className='ai-typing';d.id='aiTyping';d.innerHTML='<span></span><span></span><span></span>';c.appendChild(d);c.scrollTop=c.scrollHeight}
function removeAiTyping(){document.getElementById('aiTyping')?.remove()}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('gradeGrid').innerHTML=GRADES.map(g=>`<div class="grade-card" onclick="showTopics(${g.id})"><div class="grade-badge">${g.badge}</div><div class="grade-num">${g.id}</div><div class="grade-label">${g.label}</div></div>`).join('');
});
